name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux: GCC + OpenMP, Windows: MSVC + OpenMP,
        # macOS: Apple Clang without OpenMP (checks the serial build).
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run example
        shell: bash
        run: |
          exe=build/truss_solver
          [ -f build/Release/truss_solver.exe ] && exe=build/Release/truss_solver.exe
          "$exe" examples/four_node_truss.txt
